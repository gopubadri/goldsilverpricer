name: Gold and silver price notification
# Sends INR-per-gram gold and silver prices to Telegram.

on:
  workflow_dispatch:
  schedule:
    # 09:00, 13:00, and 18:00 IST (UTC+5:30), Monday–Friday.
    - cron: "30 3,7,12 * * 1-5"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send price notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python price_fetcher.py
